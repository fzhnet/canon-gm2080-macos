# CUPS configuration for the GM2080 bridge container.
#
# Access control is intentionally permissive: the container port is published
# only on the host loopback (127.0.0.1:6631), so the only thing that can reach
# this daemon is the Mac it runs on.  Do NOT republish 631 on 0.0.0.0.
#
# NOTE: cupsd.conf has no line-continuation syntax.  Every <Limit> operation
# list must stay on a single line - a trailing backslash is a syntax error and
# makes the scheduler refuse to start.

LogLevel warn
MaxLogSize 1m
ErrorPolicy retry-job
PreserveJobHistory On
PreserveJobFiles Off

# Inside the container we must listen on all interfaces for the published
# port mapping to reach us; the host binding is what actually confines it.
Listen 0.0.0.0:631

# The local CUPS clients (lpadmin/lpstat, used by entrypoint.sh) talk to the
# scheduler over this Unix socket by default.  Omitting it makes every client
# command fail with "Unable to connect to server: Bad file descriptor".
Listen /run/cups/cups.sock

# No shared-printer advertisement - macOS is pointed at this queue explicitly.
Browsing Off
BrowseLocalProtocols none

DefaultAuthType Basic
WebInterface Yes

# Keep a job around long enough for the socket backend to retry across a
# VPN hiccup rather than failing the job outright.
JobRetryLimit 5
JobRetryInterval 30

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow all
</Location>

<Location /admin/log>
  Order allow,deny
  Allow all
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default>
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    Order deny,allow
  </Limit>

  <Limit Cancel-Job CUPS-Authenticate-Job>
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
